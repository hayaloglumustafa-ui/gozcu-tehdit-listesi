name: Tehdit listesini guncelle

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tehdit-listesi
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli paketler
        run: pip install "pyyaml==6.0.2" "cryptography==43.0.3"

      - name: Listeyi hazirla ve imzala
        env:
          GOZCU_SIGNING_KEY: ${{ secrets.GOZCU_SIGNING_KEY }}
        run: python tools/build_list.py --out-dir .

      - name: Degistiyse yayinla
        run: |
          if git diff --quiet -- threat_list.signed.json threat_list.json; then
            echo "Degisiklik yok."
            exit 0
          fi
          git config user.name "gozcu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threat_list.signed.json threat_list.json
          git commit -m "Tehdit listesi guncellendi"
          git push
